# 方寸观察者模拟学习系统 — 全局配置（统一架构版）
# 所有管道名、超时参数、评分权重等集中配置

# ============================================================
# 运行模式 (新增)
# ============================================================
mode: "auto"
# 可选值: "auto" | "simulation" | "strace" | "ebpf" | "file_replay" | "deep_agent" | "mcp_report"

# ============================================================
# 管道配置 (新增，统一跨平台管道配置)
# ============================================================
pipeline:
  # Windows (命名管道)
  win_event_pipe: "\\\\.\\pipe\\observer_events"
  win_command_pipe: "\\\\.\\pipe\\observer_commands"
  # Linux (FIFO)
  linux_event_fifo: "/tmp/observer/events"
  linux_command_fifo: "/tmp/observer/commands"

# ============================================================
# 模拟模式配置 (新增)
# ============================================================
simulation:
  scenarios_dir: "scenarios/"
  cpp_probe_exe: "cpp_probe/build/cpp_probe"
  virtual_clock_start_ns: 0
  step_by_step: true

# ============================================================
# eBPF 采集模式配置 (新增)
# ============================================================
ebpf:
  bpf_object_path: "ebpf/observer.bpf.o"
  target_pid: null                  # 运行时指定 (--pid 参数)
  target_agent_id: "observed-agent"
  perf_buffer_page_count: 64
  heartbeat_interval_sec: 15

# ============================================================
# strace 采集模式配置 (新增，降级备选)
# ============================================================
strace:
  strace_bin: "/usr/bin/strace"
  trace_syscalls: "execve,openat,connect,unlink,sendto"
  target_pid: null

# ============================================================
# 文件回放采集模式配置 (新增，白盒测试 / 外部数据接入)
# ============================================================
file_replay:
  data_file: "test_data/whitebox/malicious_curl.jsonl"   # 默认回放文件（JSONL / CSV）
  loop: false                      # 是否循环回放
  time_scale: 1.0                  # 时间缩放因子（1.0 = 原始速度）
  target_agent_id: "replay-agent"  # 默认 agent 标识

# ============================================================
# Pydantic-DeepAgents 采集模式配置
# ============================================================
deep_agent:
  mode: "simulation"               # simulation (无需 API Key) | live (需 ANTHROPIC_API_KEY)
  scenarios_dir: "scenarios/deep_agent/"  # Agent 行为场景目录
  target_agent_id: "deep-agent"    # 默认 Agent 标识
  task: "分析数据并生成报告"          # live 模式下发给 Agent 的指令
  duration_s: 60                   # live 模式最大监控时长 (秒)

# ============================================================
# MCP 申报采集模式配置（Windows WorkBuddy 降级监测，P4）
# 运行入口: python observer.py daemon --mode mcp_report
# ============================================================
mcp_report:
  framework: "pydantic-deep"        # HookRegistry 框架名（工具→事件类型映射）
  target_agent_id: "workbuddy"      # 默认 Agent 标识
  poll_timeout_s: 0.2                # collector 消费 broker 的轮询间隔（秒）
  host: "127.0.0.1"                  # MCP Server 监听地址（HTTP+SSE）
  port: 8765                         # MCP Server 监听端口
  jsonl_dir: null                    # 申报留痕目录（null = 不落盘，仅内存队列）

# ============================================================
# 以下为现有配置段，全部保留不做修改
# ============================================================

# === 管道通信配置 (保留，Windows 模拟模式使用) ===
pipes:
  events: "\\\\.\\pipe\\observer_events"      # 正向管道: C++ → Python
  commands: "\\\\.\\pipe\\observer_commands"   # 反向管道: Python → C++
  connect_timeout_ms: 5000                    # 管道连接超时（毫秒）
  heartbeat_interval_ms: 1000                 # 心跳间隔（毫秒）
  heartbeat_max_miss: 3                       # 最大心跳未响应次数

# === 虚拟时钟配置 (保留) ===
virtual_clock:
  start_ns: 1718092800000000000               # 起始时间戳 (2024-06-11 08:00:00 UTC)

# === 风险评分权重 (保留，维持 dimensions 嵌套结构) ===
scoring:
  dimensions:
    rule_match:
      weight: 0.40
      class: "BasicRuleScore"
    baseline_deviation:
      weight: 0.25
      class: "BasicBaselineScore"
    context_risk:
      weight: 0.20
      class: "BasicContextScore"
    sequence_anomaly:
      weight: 0.15
      class: "BasicSequenceScore"
  risk_levels:
    low_max: 0.3
    medium_max: 0.6

# === 阻断升级配置 (保留) ===
blocking:
  violation_window_ms: 300000                 # 违规升级滑动窗口（5分钟，虚拟时钟）
  tier1_to_tier2_threshold: 5                 # Tier1 累计次数 → 升级 Tier2
  tier2_to_tier3_threshold: 3                 # Tier2 累计次数 → 升级 Tier3

# === 事件序列窗口 (保留) ===
monitoring:
  event_window_size: 10                       # 最近 N 个事件用于上下文分析
  process_window_ms: 60000                    # 进程关联时间窗口（毫秒）

# === 基线配置 (保留) ===
baseline:
  cold_start_deviation: 0.0                   # 冷启动期偏离分固定值
  min_events_for_baseline: 20                 # 最少事件数才激活偏离检测

# === 输出配置 (保留) ===
output:
  audit_dir: "output/audit"                   # 审计日志目录
  reports_dir: "output/reports"               # 风险分析报告目录
  graphs_dir: "output/graphs"                 # 行为图谱目录
  baselines_dir: "output/baselines"           # 基线快照目录
  audit_format: "jsonl"                       # 审计日志格式
  retention_days: 30                          # L0 审计文件保留天数（按天滚动 + 惰性清理）

