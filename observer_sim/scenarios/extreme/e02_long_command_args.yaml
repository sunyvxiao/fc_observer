scenario:
  id: e02-long-command-args
  name: E02-超长命令行参数
  description: 包含大量JSON内联数据的curl POST
  expected_result: 超长命令行正常解析
  category: extreme
  agents:
  - agent_id: stress-1
    framework: LangChain
    initial_pid: 70002
    description: 超长参数Agent
  event_sequence:
  - seq: 1
    delay_ms: 0
    agent: stress-1
    type: exec
    executable: /usr/bin/curl
    arguments:
    - -X
    - POST
    - -H
    - 'Content-Type: application/json'
    - -d
    - '{"data":"","items":[{"id":0},{"id":1},{"id":2},{"id":3},{"id":4},{"id":5},{"id":6},{"id":7},{"id":8},{"id":9},{"id":10},{"id":11},{"id":12},{"id":13},{"id":14},{"id":15},{"id":16},{"id":17},{"id":18},{"id":19}]}'
    - https://api.internal.com/ingest
  - seq: 2
    delay_ms: 2000
    agent: stress-1
    type: net_conn
    remote_addr: 10.0.1.100
    remote_port: 443
    protocol: TCP
