scenario:
  id: n02-dependency-install
  name: N02-依赖安装与构建
  description: Agent在隔离构建环境中安装依赖并编译项目
  expected_result: 全部放行,包管理器写入不误报
  category: normal
  agents:
  - agent_id: build-agent-1
    framework: LangChain
    initial_pid: 10101
    description: 构建Agent
  event_sequence:
  - seq: 1
    delay_ms: 0
    agent: build-agent-1
    type: exec
    executable: /usr/bin/pip
    arguments:
    - install
    - -r
    - requirements.txt
    - --target
    - /home/dev/venv/lib/
  - seq: 2
    delay_ms: 2000
    agent: build-agent-1
    type: file_open
    file_path: /home/dev/venv/lib/python3.11/site-packages/numpy/__init__.py
    file_op: write
  - seq: 3
    delay_ms: 1000
    agent: build-agent-1
    type: exec
    executable: /usr/bin/npm
    arguments:
    - install
    - --prefix
    - /home/dev/frontend/
  - seq: 4
    delay_ms: 3000
    agent: build-agent-1
    type: net_conn
    remote_addr: 104.16.21.14
    remote_port: 443
    protocol: TCP
  - seq: 5
    delay_ms: 500
    agent: build-agent-1
    type: exec
    executable: /usr/bin/make
    arguments:
    - build
  - seq: 6
    delay_ms: 2000
    agent: build-agent-1
    type: file_open
    file_path: /home/dev/build/output/version.txt
    file_op: read
