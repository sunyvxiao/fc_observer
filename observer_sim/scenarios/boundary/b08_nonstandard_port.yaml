scenario:
  id: b08-nonstandard-port
  name: B08-非标准端口内网服务
  description: 连接内网服务使用非标准端口8080/8443
  expected_result: 内网IP信任但端口异常,MEDIUM ALERT
  category: boundary
  agents:
  - agent_id: code-1
    framework: LangChain
    initial_pid: 10001
    description: 非标准端口Agent
  event_sequence:
  - seq: 1
    delay_ms: 0
    agent: code-1
    type: net_conn
    remote_addr: 10.0.1.50
    remote_port: 8080
    protocol: TCP
  - seq: 2
    delay_ms: 500
    agent: code-1
    type: net_conn
    remote_addr: 10.0.1.50
    remote_port: 8443
    protocol: TCP
