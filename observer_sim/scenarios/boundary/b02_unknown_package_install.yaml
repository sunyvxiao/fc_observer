scenario:
  id: b02-unknown-package-install
  name: B02-安装未知第三方包
  description: pip install不在白名单中的包
  expected_result: pip install触发R006,MEDIUM ALERT
  category: boundary
  agents:
  - agent_id: code-1
    framework: LangChain
    initial_pid: 10002
    description: 安装Agent
  event_sequence:
  - seq: 1
    delay_ms: 0
    agent: code-1
    type: exec
    executable: /usr/bin/pip
    arguments:
    - install
    - little-known-package
    - --target
    - /home/dev/venv/lib/
  - seq: 2
    delay_ms: 2000
    agent: code-1
    type: net_conn
    remote_addr: 151.101.128.223
    remote_port: 443
    protocol: TCP
  - seq: 3
    delay_ms: 1000
    agent: code-1
    type: file_open
    file_path: /home/dev/venv/lib/python3.11/site-packages/little_known/__init__.py
    file_op: write
