# 方寸观察者 — 统一安全策略规则库（生产级扩展版）
#
# 版本: 2.0
# 变更记录:
#   - R001 扩展 rm -rf 检测范围（pattern → regex，覆盖痕迹清除和磁盘破坏）
#   - R002 扩展远程代码执行检测（新增 eval/bash -c 间接执行）
#   - R003 扩展危险权限变更检测（新增 chown root/chattr -i）
#   - R004 扩展权限提升检测（新增 su -/pkexec）
#   - R005 扩展数据外传检测（新增 nc/ncat/socat 反向 shell）
#   - R006 扩展软件包安装检测（新增 npm -g/gem/cargo install）
#   - R007 修复凭据文件 glob 覆盖盲区（新增 *credentials*, *_key*, *token* 等）
#   - R007b 新增凭据/密钥文件阻断规则（priority=100，解决无规则命中时评分过低问题）
#   - R008 扩展系统目录保护范围
#   - R009 扩展文件操作检测 + 优先级调整
#   - R010 扩展配置文件类型
#   - R011 扩展 SSH 基础设施检测（新增 deploy_key, authorized_keys, *.ppk 等）
#   - R013 扩展可疑端口范围
#   - R014 扩展已知恶意 IP 列表
#   - R015 扩展匿名网络检测（新增 .i2p）
#   - R016 新增 Shell 脚本执行告警
#   - R017 新增持久化机制告警
#   - R018 新增防御规避行为告警
#   - R019 新增大文件读取告警
#   - R020 新增非常用出站端口告警
#
# 规则分类: command(9) + file(7) + network(5) = 21条

version: "2.0"
metadata:
  created: "2026-01-01"
  updated: "2026-08-02"
  description: "统一安全策略 — 方寸观察者模拟学习系统（生产级扩展版）"
  previous_version: "1.0"
  change_summary: "修复 R007/R001/R005 覆盖盲区，新增 6 条生产级规则"

rules:
  # ==================== 命令执行规则 (command) — 9条 ====================

  - rule_id: "R001"
    name: "block-dangerous-destructive-commands"
    category: "command"
    priority: 100
    enabled: true
    action: block
    description: "阻断破坏性系统命令（删除、格式化、覆写块设备）"
    conditions:
      event_type: "exec"
      match_mode: "regex"
      patterns:
        - "rm\\s+-rf\\s+/"           # rm -rf / 根目录
        - "rm\\s+-rf\\s+/\\*"        # rm -rf /*
        - "rm\\s+-rf\\s+~"           # rm -rf ~ 主目录
        - "rm\\s+-rf\\s+\\$HOME"     # rm -rf $HOME
        - "dd\\s+if=/dev/zero"       # 磁盘清零
        - "mkfs"                     # 格式化文件系统
        - ">\\s*/dev/sd[a-z]"        # 覆写块设备
        - "fdisk\\s+/dev/"           # 磁盘分区操作

  - rule_id: "R002"
    name: "block-remote-code-execution"
    category: "command"
    priority: 95
    enabled: true
    action: block
    description: "阻断远程代码执行攻击（curl/wget 管道执行、eval 间接执行）"
    conditions:
      event_type: "exec"
      match_mode: "regex"
      patterns:
        - "(curl|wget).*\\|.*(bash|sh|python|perl|ruby|node)"
        - "eval\\s+.*(curl|wget)"
        - "bash\\s+-c\\s+.*(curl|wget)"

  - rule_id: "R003"
    name: "alert-dangerous-permission-change"
    category: "command"
    priority: 70
    enabled: true
    action: alert
    description: "告警危险权限变更（chmod 777、chown root、chattr -i）"
    conditions:
      event_type: "exec"
      match_mode: "regex"
      patterns:
        - "chmod\\s+777"
        - "chmod\\s+-R\\s+777"
        - "chown\\s+root:"
        - "chattr\\s+-i"

  - rule_id: "R004"
    name: "alert-privilege-escalation"
    category: "command"
    priority: 65
    enabled: true
    action: alert
    description: "告警权限提升操作（sudo、su -、pkexec）"
    conditions:
      event_type: "exec"
      match_mode: "regex"
      patterns:
        - "sudo\\s"
        - "su\\s+-"
        - "pkexec"

  - rule_id: "R005"
    name: "block-data-exfiltration"
    category: "command"
    priority: 90
    enabled: true
    action: block
    description: "阻断通过 curl/wget/nc/socat 外传数据或建立反向 shell"
    conditions:
      event_type: "exec"
      match_mode: "regex"
      patterns:
        - "(curl|wget).*(-d|--data|-F|--form|--upload-file)"
        - "nc\\s+.*\\s+-e\\s"
        - "ncat\\s+.*\\s+-e\\s"
        - "socat\\s+.*exec:"

  - rule_id: "R006"
    name: "alert-untrusted-package-install"
    category: "command"
    priority: 40
    enabled: true
    action: alert
    description: "告警安装第三方软件包（pip/npm/gem/cargo install）"
    conditions:
      event_type: "exec"
      match_mode: "regex"
      patterns:
        - "(pip|pip3)\\s+install"
        - "npm\\s+install\\s+-g"
        - "gem\\s+install"
        - "cargo\\s+install"

  - rule_id: "R016"
    name: "alert-shell-script-execution"
    category: "command"
    priority: 55
    enabled: true
    action: alert
    description: "告警执行 Shell 脚本（可能引入未审计的代码执行）"
    conditions:
      event_type: "exec"
      match_mode: "regex"
      patterns:
        - "(bash|sh|zsh|dash)\\s+.*\\.sh"
        - "bash\\s+-c\\s"
        - "source\\s+.*\\."

  - rule_id: "R017"
    name: "alert-persistence-mechanism"
    category: "command"
    priority: 75
    enabled: true
    action: alert
    description: "告警持久化机制操作（crontab、systemctl enable、at）"
    conditions:
      event_type: "exec"
      match_mode: "regex"
      patterns:
        - "crontab\\s+-"
        - "systemctl\\s+enable"
        - "update-rc\\.d"
        - "at\\s+"
        - "echo.*>>\\s*/etc/rc\\.local"

  - rule_id: "R018"
    name: "alert-defense-evasion"
    category: "command"
    priority: 80
    enabled: true
    action: alert
    description: "告警防御规避行为（清除日志、历史记录、shred、通用 rm -rf）"
    conditions:
      event_type: "exec"
      match_mode: "regex"
      patterns:
        - "rm\\s+-rf\\s+"
        - "history\\s+-c"
        - "unset\\s+HISTFILE"
        - "set\\s+\\+o\\s+history"
        - "rm\\s+.*\\.bash_history"
        - "shred\\s+-"

  # ==================== 文件操作规则 (file) — 9条 ====================

  - rule_id: "R007b"
    name: "block-credential-file-access"
    category: "file"
    priority: 100
    enabled: true
    action: block
    description: "阻断凭据/密钥文件访问（.env、credentials、*_key、*.pem 等）"
    conditions:
      event_type: "file_open"
      match_mode: "path_glob"
      patterns:
        - "*.db_credentials*"
        - "*credentials*"
        - "*.credential*"
        - "*_credentials"
        - "*.pem"
        - "*.p12"
        - "*.pfx"
        - "*_key"
        - "*_key.*"
        - "deploy_key*"
        - "*private_key*"
        - "*id_rsa*"
        - "*id_ed25519*"
        - "*id_ecdsa*"
        - "*.env"
        - "*.env.*"
        - "*.envrc"

  - rule_id: "R007"
    name: "alert-sensitive-file-access"
    category: "file"
    priority: 80
    enabled: true
    action: alert
    description: "告警访问敏感配置文件（环境变量、凭据、令牌、系统敏感文件）"
    conditions:
      event_type: "file_open"
      match_mode: "path_glob"
      patterns:
        # 环境变量与配置
        - "*.env"
        - "*.env.*"
        - "*.envrc"
        # 凭据文件
        - "*.db_credentials*"
        - "*credentials*"
        - "*.credential*"
        - "*_credentials"
        # 密钥文件
        - "*.key"
        - "*.pem"
        - "*.p12"
        - "*.pfx"
        - "*_key"
        - "*_key.*"
        - "deploy_key*"
        - "*private_key*"
        # 令牌与机密
        - "*secret*"
        - "*token*"
        - "*password*"
        # 系统敏感文件
        - "*/etc/shadow*"
        - "*/etc/passwd*"
        - "*/etc/sudoers*"

  - rule_id: "R008"
    name: "block-system-directory-write"
    category: "file"
    priority: 85
    enabled: true
    action: block
    description: "阻断写入关键系统目录"
    conditions:
      event_type: "file_open"
      match_mode: "path_glob"
      patterns:
        - "/etc/*"
        - "/usr/bin/*"
        - "/usr/sbin/*"
        - "/usr/lib/*"
        - "/boot/*"
        - "/lib/systemd/system/*"
        - "C:\\Windows\\*"
        - "C:\\Program Files\\*"
        - "C:\\Program Files (x86)\\*"

  - rule_id: "R009"
    name: "alert-mass-file-operation"
    category: "file"
    priority: 60
    enabled: true
    action: alert
    description: "告警文件删除/重命名/解链操作（可能清除痕迹）"
    conditions:
      event_type: "file_open"
      match_mode: "pattern"
      patterns:
        - "delete"
        - "rename"
        - "unlink"

  - rule_id: "R010"
    name: "alert-config-file-modification"
    category: "file"
    priority: 50
    enabled: true
    action: alert
    description: "告警修改配置文件"
    conditions:
      event_type: "file_open"
      match_mode: "path_glob"
      patterns:
        - "*.yaml"
        - "*.yml"
        - "*.conf"
        - "*.ini"
        - "*.toml"
        - "*.json"
        - "*.xml"

  - rule_id: "R011"
    name: "block-ssh-infrastructure-access"
    category: "file"
    priority: 95
    enabled: true
    action: block
    description: "阻断 SSH 基础设施文件访问（密钥、known_hosts、authorized_keys）"
    conditions:
      event_type: "file_open"
      match_mode: "path_glob"
      patterns:
        - "*/.ssh/*"
        - "*id_rsa*"
        - "*id_ed25519*"
        - "*id_ecdsa*"
        - "*id_dsa*"
        - "deploy_key*"
        - "*authorized_keys*"
        - "*known_hosts*"
        - "*.pem"
        - "*.ppk"

  - rule_id: "R019"
    name: "alert-large-file-read"
    category: "file"
    priority: 45
    enabled: true
    action: alert
    description: "告警读取大型数据文件（.sql/.dump/.bak，可能数据窃取）"
    conditions:
      event_type: "file_open"
      match_mode: "path_glob"
      patterns:
        - "*.sql"
        - "*.dump"
        - "*.bak"

  # ==================== 网络规则 (network) — 5条 ====================

  - rule_id: "R012"
    name: "alert-external-network-connection"
    category: "network"
    priority: 75
    enabled: true
    action: alert
    description: "告警外联非内网地址（排除 10.x, 172.16-31.x, 192.168.x, 127.x）"
    conditions:
      event_type: "net_conn"
      match_mode: "regex"
      patterns:
        - "^(?!10\\.)"
        - "^(?!172\\.(1[6-9]|2[0-9]|3[01])\\.)"
        - "^(?!192\\.168\\.)"
        - "^(?!127\\.)"

  - rule_id: "R013"
    name: "alert-unusual-port-connection"
    category: "network"
    priority: 70
    enabled: true
    action: alert
    description: "告警非标准端口连接（非常用/高风险端口）"
    conditions:
      event_type: "net_conn"
      match_mode: "regex"
      patterns:
        - ":4444$"
        - ":1337$"
        - ":31337$"
        - ":6666$"
        - ":6667$"
        - ":6697$"
        - ":5555$"
        - ":9999$"
        - ":3389$"

  - rule_id: "R014"
    name: "block-known-bad-ip"
    category: "network"
    priority: 95
    enabled: true
    action: block
    description: "阻断已知恶意 IP 连接"
    conditions:
      event_type: "net_conn"
      match_mode: "pattern"
      patterns:
        - "45.33.32.156"
        - "203.0.113.50"
        - "198.51.100.0"

  - rule_id: "R015"
    name: "alert-anonymous-network"
    category: "network"
    priority: 55
    enabled: true
    action: alert
    description: "告警匿名网络连接（.onion/.tor/.i2p）"
    conditions:
      event_type: "net_conn"
      match_mode: "regex"
      patterns:
        - ".*\\.onion$"
        - ".*\\.tor$"
        - ".*\\.i2p$"

  - rule_id: "R020"
    name: "alert-unusual-outbound-port"
    category: "network"
    priority: 60
    enabled: true
    action: alert
    description: "告警非常用出站端口连接（SSH/Telnet/SMTP/RDP/Redis/MongoDB）"
    conditions:
      event_type: "net_conn"
      match_mode: "pattern"
      patterns:
        - ":22"
        - ":23"
        - ":25"
        - ":587"
        - ":3389"
        - ":5900"
        - ":6379"
        - ":27017"
